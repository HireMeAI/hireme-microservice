spring:
  application:
    name: Gateway
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AuthService
          predicates:
            - Path=/api/auth/**

        - id: candidate-service
          uri: lb://AuthService
          predicates:
            - Path=/api/candidate/**

        - id: resume-service
          uri: lb://ResumeService
          predicates:
            - Path=/api/resumes/**,/api/contacts/**,/api/educations/**,/api/experiences/**,/api/skills/**,/api/languages/**,/api/templates/**

server:
  port: ${GATEWAY_PORT:-8080}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
