spring:
  application:
   name: eureka-server
server:
  port: ${EUREKA_SERVER_PORT:8761}
  servlet:
    context-path: /eureka
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/