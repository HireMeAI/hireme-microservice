services:
  db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mail-server:
    image: axllent/mailpit
    container_name: auth-mail
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:${EUREKA_SERVER_PORT:-8761}"
    environment:
      - EUREKA_SERVER_PORT=${EUREKA_SERVER_PORT:-8761}
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:${EUREKA_SERVER_PORT:-8761}/eureka/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./hireme-auth-service
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:${AUTH_SERVICE_PORT:-8081}"
    environment:
      - APP_PORT=${AUTH_SERVICE_PORT:-8081}
      - APP_BASE_URL=${APP_BASE_URL}
      - PG_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - MAIL_HOST=mail-server
      - MAIL_PORT=1025
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_AUTH=${MAIL_AUTH}
      - MAIL_STARTTLS=${MAIL_STARTTLS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  resume-db:
    image: postgres:17-alpine
    container_name: resume-db
    environment:
      POSTGRES_DB: ${RESUME_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - resume_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${RESUME_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  resume-service:
    build: ./hireme-resume-service
    container_name: resume-service
    ports:
      - "${RESUME_SERVICE_PORT:-8082}:${RESUME_SERVICE_PORT:-8082}"
    environment:
      - APP_PORT=${RESUME_SERVICE_PORT:-8082}
      - PG_URL=jdbc:postgresql://resume-db:5432/${RESUME_POSTGRES_DB}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      resume-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  job-db:
    image: postgres:17-alpine
    container_name: job-db
    environment:
      POSTGRES_DB: ${JOB_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - job_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${JOB_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  job-service:
    build: ./hireme-job-service
    container_name: job-service
    ports:
      - "${JOB_SERVICE_PORT:-8083}:${JOB_SERVICE_PORT:-8083}"
    environment:
      - APP_PORT=${JOB_SERVICE_PORT:-8083}
      - PG_URL=jdbc:postgresql://job-db:5432/${JOB_POSTGRES_DB}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      job-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  gateway:
    build: ./hireme-gateway
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  resume_postgres_data:
  job_postgres_data:
