services:
  db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mail-server:
    image: axllent/mailpit
    container_name: auth-mail
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    # Mode KRaft (sans ZooKeeper) — broker + controller combinés, nœud unique pour le MVP.
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:${EUREKA_SERVER_PORT:-8761}"
    environment:
      - EUREKA_SERVER_PORT=${EUREKA_SERVER_PORT:-8761}
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:${EUREKA_SERVER_PORT:-8761}/eureka/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./hireme-auth-service
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:${AUTH_SERVICE_PORT:-8081}"
    environment:
      - APP_PORT=${AUTH_SERVICE_PORT:-8081}
      - APP_BASE_URL=${APP_BASE_URL}
      - PG_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - MAIL_HOST=mail-server
      - MAIL_PORT=1025
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_AUTH=${MAIL_AUTH}
      - MAIL_STARTTLS=${MAIL_STARTTLS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - HIREME_PII_KEY=${HIREME_PII_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  resume-db:
    image: postgres:17-alpine
    container_name: resume-db
    environment:
      POSTGRES_DB: ${RESUME_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - resume_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${RESUME_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  resume-service:
    build: ./hireme-resume-service
    container_name: resume-service
    ports:
      - "${RESUME_SERVICE_PORT:-8082}:${RESUME_SERVICE_PORT:-8082}"
    environment:
      - APP_PORT=${RESUME_SERVICE_PORT:-8082}
      - PG_URL=jdbc:postgresql://resume-db:5432/${RESUME_POSTGRES_DB}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      resume-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  job-db:
    image: postgres:17-alpine
    container_name: job-db
    environment:
      POSTGRES_DB: ${JOB_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - job_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${JOB_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  job-service:
    build: ./hireme-job-service
    container_name: job-service
    ports:
      - "${JOB_SERVICE_PORT:-8083}:${JOB_SERVICE_PORT:-8083}"
    environment:
      - APP_PORT=${JOB_SERVICE_PORT:-8083}
      - PG_URL=jdbc:postgresql://job-db:5432/${JOB_POSTGRES_DB}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      job-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  matching-db:
    image: postgres:17-alpine
    container_name: matching-db
    environment:
      POSTGRES_DB: ${MATCHING_POSTGRES_DB:-hireme_matching}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - matching_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${MATCHING_POSTGRES_DB:-hireme_matching}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  matching-service:
    build: ./hireme-matching-service
    container_name: matching-service
    ports:
      - "${MATCHING_SERVICE_PORT:-8084}:${MATCHING_SERVICE_PORT:-8084}"
    environment:
      - APP_PORT=${MATCHING_SERVICE_PORT:-8084}
      - PG_URL=jdbc:postgresql://matching-db:5432/${MATCHING_POSTGRES_DB:-hireme_matching}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - ML_ENGINE_URL=http://ml-engine:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      matching-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  ml-engine:
    build: ../hireme-ml-engine
    container_name: ml-engine
    # Moteur interne : non exposé à l'extérieur, appelé par le MatchingService via le réseau Docker.
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: always

  gateway:
    build: ./hireme-gateway
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  resume_postgres_data:
  job_postgres_data:
  matching_postgres_data:
