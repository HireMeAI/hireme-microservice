services:
  db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mail-server:
    image: axllent/mailpit
    container_name: auth-mail
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:${EUREKA_SERVER_PORT:-8761}"
    environment:
      - EUREKA_SERVER_PORT=${EUREKA_SERVER_PORT:-8761}
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:${EUREKA_SERVER_PORT:-8761}/eureka/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./hireme-auth-service
    container_name: auth-service
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      - APP_PORT=${APP_PORT}
      - APP_BASE_URL=${APP_BASE_URL}
      - PG_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - MAIL_HOST=mail-server
      - MAIL_PORT=1025
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_AUTH=${MAIL_AUTH}
      - MAIL_STARTTLS=${MAIL_STARTTLS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - EUREKA_SERVER_URL=http://eureka-server:${EUREKA_SERVER_PORT:-8761}/eureka/eureka/
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
